<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="carousel.css">

<!-- taruh di dalam .mindset -->
<div class="c-wrap">
    <div class="c-stage" id="c-stage"></div>
    <div class="c-dots" id="c-dots"></div>
    <div class="c-bar-wrap">
        <div class="c-bar" id="c-bar"></div>
    </div>
    <div class="c-controls">
        <button class="c-btn" id="c-prev" aria-label="Previous">&#8592;</button>
        <button class="c-btn" id="c-pause" aria-label="Pause">&#9646;&#9646;</button>
        <button class="c-btn" id="c-next" aria-label="Next">&#8594;</button>
    </div>
</div>

<!-- taruh sebelum </body> -->
<script src="carousel.js"></script>
